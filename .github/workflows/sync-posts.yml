# Pull new Medium and Substack posts into posts.json once a day.
# Works once this folder is the root of a GitHub repository with Pages enabled.
name: Sync posts

on:
  schedule:
    - cron: "0 22 * * *"   # 06:00 Taipei time
  workflow_dispatch: {}    # also runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-posts.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- posts.json; then
            echo "No new posts."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "Sync posts from Medium and Substack"
            git push
          fi
